name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run the suite by hand on a branch, from the Actions tab.
  workflow_dispatch:

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # Single check required by the main branch protection:
  # it passes only if all matrix jobs succeeded.
  tests-passed:
    name: All tests passed
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = "success"
